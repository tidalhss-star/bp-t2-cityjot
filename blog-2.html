<head>

  <link rel="canonical" href="https://cityjot.shop/blog-2.html">

  <meta property="og:description" content="셔츠룸, 하이퍼블릭, 텐프로. 당신이 몰랐던 가격표의 민낯을 공개합니다. 더 이상 '시세'라는 모호한 말에 속지 마세요.">
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-card: #1a1a1a;
      --text-primary: #f0f0f0;
      --text-secondary: #a3a3a3;
      --text-muted: #6b6b6b;
      --accent-gold: #c9a84c;
      --accent-gold-dim: #8a7335;
      --border-color: #2a2a2a;
      --border-light: #333333;
      --font-serif: 'Noto Serif KR', 'Times New Roman', serif;
      --font-sans: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      --spacing-xs: 0.5rem;
      --spacing-sm: 1rem;
      --spacing-md: 2rem;
      --spacing-lg: 4rem;
      --spacing-xl: 6rem;
      --radius-sm: 0.5rem;
      --radius-md: 1rem;
      --radius-lg: 1.5rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.02em;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--spacing-md);
    }

    /* Navigation */
    .main-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 0;
      transition: all 0.3s ease;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--spacing-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .nav-logo span {
      color: var(--accent-gold);
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: color 0.2s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1.5px;
      background-color: var(--accent-gold);
      transition: width 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-links a.active {
      color: var(--accent-gold);
    }

    .nav-links a.active::after {
      width: 100%;
      background-color: var(--accent-gold);
    }

    /* Hero Section */
    .hero-comparison {
      padding: var(--spacing-xl) 0 var(--spacing-lg);
      border-bottom: 1px solid var(--border-color);
      background: radial-gradient(ellipse at 20% 30%, #1a1a0f 0%, var(--bg-primary) 60%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-lg);
      align-items: center;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.6rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: var(--spacing-sm);
    }

    .hero-title em {
      font-style: normal;
      color: var(--accent-gold);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 8px;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-md);
      max-width: 480px;
      border-left: 3px solid var(--accent-gold-dim);
      padding-left: var(--spacing-sm);
      font-weight: 400;
    }

    .hero-stats {
      display: flex;
      gap: var(--spacing-md);
      margin-top: var(--spacing-sm);
    }

    .hero-stat {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 0.7rem 1.2rem;
      text-align: center;
    }

    .hero-stat-number {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-gold);
      line-height: 1.2;
    }

    .hero-stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .hero-image-placeholder {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border: 1px dashed var(--border-light);
      font-family: var(--font-serif);
      font-size: 1.1rem;
      text-align: center;
      line-height: 1.5;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    /* Comparison Tables */
    .section-title {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      font-weight: 700;
      margin: var(--spacing-lg) 0 var(--spacing-md);
      padding-bottom: var(--spacing-xs);
      border-bottom: 2px solid var(--accent-gold-dim);
      display: inline-block;
      letter-spacing: -0.02em;
    }

    .comparison-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: var(--spacing-md) 0 var(--spacing-lg);
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .comparison-table th {
      background-color: #111;
      color: var(--accent-gold);
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 1rem 1.2rem;
      text-align: left;
      border-bottom: 2px solid var(--accent-gold-dim);
    }

    .comparison-table td {
      padding: 1.1rem 1.2rem;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .comparison-table tr:last-child td {
      border-bottom: none;
    }

    .comparison-table tr:hover td {
      background-color: rgba(201, 168, 76, 0.04);
      color: var(--text-primary);
    }

    .price-highlight {
      font-weight: 700;
      color: var(--accent-gold);
      font-family: var(--font-serif);
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(201, 168, 76, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold-dim);
    }

    /* Card Cluster */
    .card-cluster {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--spacing-md);
      margin: var(--spacing-md) 0 var(--spacing-lg);
    }

    .comparison-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.8rem;
      transition: all 0.25s;
      position: relative;
    }

    .comparison-card:hover {
      border-color: var(--accent-gold-dim);
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.6);
    }

    .card-tag {
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.7rem;
    }

    .card-price-range {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 1rem;
    }

    .card-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* FAQ */
    .faq-section {
      margin: var(--spacing-xl) 0;
    }

    .faq-item {
      border-bottom: 1px solid var(--border-light);
      padding: 1.3rem 0;
    }

    .faq-question {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .faq-answer {
      color: var(--text-secondary);
      margin-top: 0.8rem;
      font-size: 0.95rem;
      line-height: 1.7;
      display: block;
    }

    .footer {
      border-top: 1px solid var(--border-color);
      padding: var(--spacing-lg) 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: var(--spacing-lg);
    }

    @media (max-width: 768px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }
      .nav-links {
        gap: 0.8rem;
      }
    }
  </style>

</head>
