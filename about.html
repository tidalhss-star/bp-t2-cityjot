<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="bpaas-design-system" content="editorial-apple">
    <meta name="bpaas-design-theme" content="kr-noir-gold">
    <title>소개 — 유흥 가격 비교 블로그 운영자</title>
    <meta name="description" content="서울 유흥 가격 비교 블로그 운영자의 전문성과 데이터 수집 방식, 객관적 비교 기준을 소개합니다. 편집형 블로그의 신뢰성 시그널을 확인하세요.">
    <meta name="keywords" content="유흥 가격 비교, 셔츠룸 가격, 룸싸롱 가격, 텐프로 가격, 텐카페 가격, 쩜오 가격, 하이퍼블릭 가격, 풀싸롱 가격, 가라오케 가격, 노래방 가격, 비즈니스클럽 가격, 마사지 가격, 펍 가격, 서울 유흥">
    <link rel="canonical" href="https://cityjot.shop/about.html">
    <meta property="og:title" content="소개 — 유흥 가격 비교 블로그 운영자의 전문성 시그널">
    <meta property="og:description" content="서울 유흥 가격 비교 데이터를 수집하고 객관적 기준으로 정리하는 블로그 운영자 소개. 신뢰할 수 있는 정보의 출처를 확인하세요.">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #888888;
            --accent-gold: #d4af37;
            --accent-gold-dim: #8b7530;
            --accent-red: #c0392b;
            --border-subtle: #2a2a2a;
            --border-gold: #3a3020;
            --font-display: 'Playfair Display', 'Times New Roman', serif;
            --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.5);
            --shadow-gold: 0 0 12px rgba(212, 175, 55, 0.15);
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Navigation */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 0;
            transition: var(--transition-smooth);
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .nav-logo:hover {
            color: #e6c44a;
            text-shadow: var(--shadow-gold);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 28px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: var(--transition-smooth);
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent-gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a.active {
            color: var(--accent-gold);
        }

        .nav-links a.active::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            padding: 80px 0 60px;
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-gold-dim);
            margin-bottom: 16px;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .hero-title span {
            color: var(--accent-gold);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
            font-weight: 300;
        }

        /* Section Headers */
        .section-header {
            text-align: center;
            margin: 60px 0 40px;
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-gold-dim);
            margin-bottom: 12px;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .section-divider {
            width: 60px;
            height: 2px;
            background: var(--accent-gold);
            margin: 20px auto 0;
            opacity: 0.6;
        }

        /* Philosophy Cards */
        .philosophy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
            margin: 40px 0 60px;
        }

        .philosophy-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 40px 32px;
            border-radius: 4px;
            transition: var(--transition-smooth);
            position: relative;
            box-shadow: var(--shadow-card);
        }

        .philosophy-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-4px);
            box-shadow: var(--shadow-card), var(--shadow-gold);
        }

        .philosophy-card-number {
            font-family: var(--font-display);
            font-size: 3rem;
            color: var(--accent-gold);
            opacity: 0.3;
            position: absolute;
            top: 20px;
            right: 24px;
            line-height: 1;
        }

        .philosophy-card-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .philosophy-card-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.8;
        }

        /* Quote Block */
        .quote-block {
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent-gold);
            padding: 40px 48px;
            margin: 60px 0;
            position: relative;
        }

        .quote-text {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-style: italic;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .quote-author {
            font-size: 0.9rem;
            color: var(--accent-gold);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Data Methodology */
        .methodology-section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 48px;
            margin: 60px 0;
            border-radius: 4px;
        }

        .methodology-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 24px;
        }

        .methodology-list {
            list-style: none;
        }

        .methodology-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .methodology-list li::before {
            content: '◆';
            color: var(--accent-gold);
            font-size: 0.6rem;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .methodology-list li:last-child {
            border-bottom: none;
        }

        /* Credibility Signals */
        .cred-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0 60px;
        }

        .cred-item {
            text-align: center;
            padding: 32px 20px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-secondary);
            transition: var(--transition-smooth);
        }

        .cred-item:hover {
            border-color: var(--accent-gold-dim);
        }

        .cred-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
            color: var(--accent-gold);
        }

        .cred-number {
            font-family: var(--font-display);
            font-size: 2.2rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .cred-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* FAQ Section */
        .faq-section {
            margin: 60px 0;
        }

        .faq-item {
            border-bottom: 1px solid var(--border-subtle);
            padding: 28px 0;
            transition: var(--transition-smooth);
        }

        .faq-question {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition-smooth);
        }

        .faq-question:hover {
            color: var(--accent-gold);
        }

        .faq-toggle {
            font-size: 1.5rem;
            color: var(--accent-gold);
            transition: transform 0.3s ease;
        }

        .faq-answer {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.8;
            padding-top: 16px;
            display: none;
        }

        .faq-item.active .faq-answer {
            display: block;
        }

        .faq-item.active .faq-toggle {
            transform: rotate(45deg);
        }

        /* CTA Banner */
        .cta-banner {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(139, 105, 48, 0.04) 100%);
            border: 1px solid var(--border-gold);
            padding: 48px;
            text-align: center;
            margin: 60px 0;
            border-radius: 4px;
        }

        .cta-text {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .cta-subtext {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .cta-button {
            display: inline-block;
            background: transparent;
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 14px 40px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .cta-button:hover {
            background: var(--accent-gold);
            color: var(--bg-primary);
        }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border-subtle);
            padding: 40px 0;
            margin-top: 60px;
            text-align: center;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
</body>
</html>
